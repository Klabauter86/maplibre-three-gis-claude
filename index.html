<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>MapLibre 3D Terrain GIS</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <label id="gpx-control" class="gpx-control" for="gpx-input">GPX laden</label>
      <!--
        iOS Safari maps `accept` to file-type UTIs when browsing the Files
        app; ".gpx"/"application/gpx+xml" alone don't resolve to a known
        UTI there, which greys out every file instead of just filtering.
        Including generic XML/text types (which GPX actually is) fixes it.
      -->
      <input
        id="gpx-input"
        type="file"
        accept=".gpx,.xml,application/gpx+xml,application/xml,text/xml,text/plain"
        hidden
      />
      <div id="status" class="status">Initialisiere 3D-GIS …</div>
      <div class="debug-stack">
        <div id="terrain-debug" class="status" hidden></div>
        <div id="fetch-debug" class="status" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
